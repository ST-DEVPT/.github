<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="ST-DEVPT: tools for the homelab, built to be left alone">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121110"/>
      <stop offset="1" stop-color="#1c1a17"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#ff6a33" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff6a33" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <g id="blade"><path d="M0-6 C14-30 34-32 44-20 C34-14 18-8 0 0Z" fill="#ff6a33"/></g>
  </defs>
  <rect width="1280" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="18" fill="url(#grid)"/>
  <rect width="1280" height="340" rx="18" fill="url(#glow)"/>

  <!-- wordmark -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="72" y="140" fill="#ebe9e4" font-size="84" font-weight="800" letter-spacing="-2">ST-DEVPT</text>
    <text x="76" y="190" fill="#ff6a33" font-size="28" font-weight="600">Tools for the homelab, built to be left alone.</text>
    <text x="76" y="232" fill="#aaa79f" font-size="20">Quiet rack servers · Jellyfin on the TV · no babysitting</text>
    <g font-family="'Cascadia Code', Consolas, monospace" font-size="15" fill="#8f8c84">
      <text x="76" y="288">$ docker run ghcr.io/st-devpt/rack-fan-control:2<tspan fill="#ff6a33">▍</tspan>
        <animate attributeName="opacity" values="1;1;0.35;1" dur="2.4s" repeatCount="indefinite"/></text>
    </g>
  </g>

  <!-- a rack: three 1U servers with status LEDs, and a fan that spins -->
  <g transform="translate(830 70)">
    <rect x="0" y="0" width="330" height="200" rx="12" fill="#0d0c0b" stroke="#3a3834"/>
    <g>
      <rect x="18" y="20" width="294" height="44" rx="6" fill="#1f1d1a" stroke="#34322e"/>
      <rect x="18" y="78" width="294" height="44" rx="6" fill="#1f1d1a" stroke="#34322e"/>
      <rect x="18" y="136" width="294" height="44" rx="6" fill="#1f1d1a" stroke="#34322e"/>
      <g fill="#3a3834">
        <rect x="34" y="36" width="120" height="4" rx="2"/><rect x="34" y="46" width="80" height="4" rx="2"/>
        <rect x="34" y="94" width="120" height="4" rx="2"/><rect x="34" y="104" width="96" height="4" rx="2"/>
        <rect x="34" y="152" width="120" height="4" rx="2"/><rect x="34" y="162" width="64" height="4" rx="2"/>
      </g>
      <circle cx="290" cy="42" r="5" fill="#5bd16a"><animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/></circle>
      <circle cx="290" cy="100" r="5" fill="#5bd16a"><animate attributeName="opacity" values="1;0.3;1" dur="2.1s" repeatCount="indefinite"/></circle>
      <circle cx="290" cy="158" r="5" fill="#ff6a33"><animate attributeName="opacity" values="1;0.4;1" dur="1.1s" repeatCount="indefinite"/></circle>
    </g>
    <!-- the fan, over the middle server -->
    <g transform="translate(220 100)">
      <circle r="58" fill="#121110" stroke="#3a3834" stroke-width="2"/>
      <g>
        <use href="#blade"/>
        <use href="#blade" transform="rotate(72)"/>
        <use href="#blade" transform="rotate(144)"/>
        <use href="#blade" transform="rotate(216)"/>
        <use href="#blade" transform="rotate(288)"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.8s" repeatCount="indefinite"/>
      </g>
      <circle r="11" fill="#1c1a17" stroke="#ff6a33" stroke-width="2"/>
    </g>
    <!-- a temperature line that settles -->
    <polyline points="18,232 70,214 120,222 170,206 220,212 270,208 312,209" fill="none" stroke="#6fa8dc" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="18" y="256" fill="#8f8c84" font-family="'Cascadia Code', Consolas, monospace" font-size="13">CPU 52°C · fans 18 % · smart</text>
  </g>
</svg>
